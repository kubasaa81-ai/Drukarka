name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Klucz podpisu
        run: base64 -d app/klucz.b64 > app/klucz.jks

      - name: Budowanie
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Bledy kompilacji
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|AAPT|ERROR" -A2 build.log | grep -v "> Task" | head -60 > bledy.txt || true
          for n in 0 1 2 3 4; do
            sed -n "$((n*12+1)),$((n*12+12))p" bledy.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
          done

      - name: Nazwa pliku
        run: cp app/build/outputs/apk/debug/app-debug.apk Drukarka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Drukarka
          path: Drukarka.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Drukarka ${{ github.run_number }}
          files: Drukarka.apk
